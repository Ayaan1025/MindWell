<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindWell – Journal</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .entry {
      padding: 16px 18px;
      margin: 12px 0;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      transition: background 0.25s ease, transform 0.25s ease,
                  border-color 0.25s ease;
    }
    .entry:hover {
      background: var(--glass-bg-strong);
      border-color: var(--glass-border-bright);
      border-left-color: var(--accent);
      transform: translateX(3px);
    }
    .entry .date { font-weight: 600; color: var(--text); margin-bottom: 8px; font-size: 14px; }
    .entry .mood { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .entry .reflection { font-size: 14px; color: var(--text-muted); }
    .mood-badge {
      display: inline-block;
      padding: 2px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      margin-left: 8px;
      border: 1px solid transparent;
      vertical-align: middle;
    }
    .badge-calm        { background: var(--mood-calm);        border-color: var(--mood-calm-line);        color: #bff0e7; }
    .badge-okay        { background: var(--mood-okay);        border-color: var(--mood-okay-line);        color: #ccdaf9; }
    .badge-anxious     { background: var(--mood-anxious);     border-color: var(--mood-anxious-line);     color: #f2d9b4; }
    .badge-overwhelmed { background: var(--mood-overwhelmed); border-color: var(--mood-overwhelmed-line); color: #f4c8d1; }
    #loading { color: var(--text-dim); font-style: italic; }
    #empty { color: var(--text-dim); text-align: center; padding: 34px 0; display: none; }
  </style>
</head>
<body>
  <div class="cosmos" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>
  <div class="mood-wash" aria-hidden="true"></div>

  <header class="fade-up">
    <nav>
      <a href="index.html">Home</a>
      <a href="chat.html">Companion</a>
      <a href="insights.html">Insights</a>
      <a href="journal.html">Journal</a>
      <a href="resources.html">Resources</a>
      <button id="logout-btn" onclick="handleLogout()">Log Out</button>
    </nav>
    <h1>MindWell</h1>
    <p>Mental Health – Emotional Check-In Interface</p>
    <div id="user-email"></div>
  </header>

  <main class="fade-up d2">
    <h2>Journal History</h2>
    <div id="loading">Loading entries...</div>
    <div id="empty">No journal entries yet. Head to the home page to log your first mood!</div>
    <div id="entries" class="stagger"></div>
  </main>

  <footer>© 2026 MindWell</footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = "login.html"; return; }
      document.getElementById("user-email").textContent = user.email;
      await loadJournal(user.uid);
    });

    window.handleLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };

    // Reflections are user-written; never hand them to innerHTML raw.
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    async function loadJournal(uid) {
      const entriesDiv = document.getElementById("entries");
      const loadingEl = document.getElementById("loading");
      const emptyEl = document.getElementById("empty");

      try {
        const snapshot = await getDocs(collection(db, "users", uid, "moods"));
        loadingEl.style.display = "none";

        let entries = [];
        snapshot.forEach(d => entries.push({ date: d.id, ...d.data() }));
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (entries.length === 0) {
          emptyEl.style.display = "block";
          return;
        }

        entriesDiv.innerHTML = entries.map(e => {
          const badgeClass = "badge-" + e.mood.toLowerCase();
          return `
            <div class="entry">
              <div class="date">${escapeHTML(e.date)} <span class="mood-badge ${escapeHTML(badgeClass)}">${escapeHTML(e.mood)}</span></div>
              <div class="reflection">${escapeHTML(e.reflection)}</div>
            </div>
          `;
        }).join("");
      } catch(err) {
        loadingEl.textContent = "Error loading entries.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
