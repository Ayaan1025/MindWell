<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal · MindWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="wordmark" href="index.html">MindWell</a>
      <p class="tagline">Daily mood check-ins and a private journal</p>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="chat.html">Companion</a>
      <a href="insights.html">Insights</a>
      <a href="journal.html" aria-current="page">Journal</a>
      <a href="resources.html">Resources</a>
    </nav>
    <div class="account">
      <span id="user-email"></span>
      <button type="button" class="link-button" id="logout-btn" onclick="handleLogout()">Log out</button>
    </div>
  </header>

  <main>
    <h1>Journal</h1>
    <p class="lede">Every check-in you've saved, newest first.</p>
    <div id="loading" aria-busy="true" aria-label="Loading entries">
      <div class="entry"><span class="skeleton skeleton-line short"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line mid"></span></div>
      <div class="entry"><span class="skeleton skeleton-line short"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line mid"></span></div>
      <div class="entry"><span class="skeleton skeleton-line short"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line mid"></span></div>
    </div>
    <p id="load-error" class="status-line error" hidden></p>
    <p id="empty" class="muted" hidden>Nothing here yet. Your entries will show up after your first <a href="index.html">check-in</a>.</p>
    <div id="entries"></div>
  </main>

  <footer class="site-footer">© 2026 MindWell</footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = "login.html"; return; }
      document.getElementById("user-email").textContent = user.email;
      await loadJournal(user.uid);
    });

    window.handleLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };

    // "2026-10-25" -> "Sunday, October 25, 2026". Parsed as local time.
    function formatDate(dateStr) {
      return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
    }

    async function loadJournal(uid) {
      const entriesDiv = document.getElementById("entries");
      const loadingEl = document.getElementById("loading");
      const emptyEl = document.getElementById("empty");

      try {
        const snapshot = await getDocs(collection(db, "users", uid, "moods"));
        loadingEl.hidden = true;

        let entries = [];
        snapshot.forEach(d => entries.push({ date: d.id, ...d.data() }));
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (entries.length === 0) {
          emptyEl.hidden = false;
          return;
        }

        // Built with textContent so reflection text is never parsed as HTML.
        entriesDiv.replaceChildren(...entries.map(e => {
          const key = String(e.mood).toLowerCase();
          const article = document.createElement("article");
          article.className = "entry";

          const meta = document.createElement("div");
          meta.className = "entry-meta";
          const date = document.createElement("time");
          date.dateTime = e.date;
          date.textContent = formatDate(e.date);
          const badge = document.createElement("span");
          badge.className = "mood-badge badge-" + key;
          const swatch = document.createElement("span");
          swatch.className = "swatch swatch-" + key;
          badge.append(swatch, String(e.mood));
          meta.append(date, badge);

          const reflection = document.createElement("div");
          reflection.className = "reflection";
          reflection.textContent = e.reflection;

          article.append(meta, reflection);
          return article;
        }));
      } catch(err) {
        loadingEl.hidden = true;
        const errorEl = document.getElementById("load-error");
        errorEl.textContent = "Couldn't load your entries. Refresh the page to try again.";
        errorEl.hidden = false;
        console.error(err);
      }
    }
  </script>
</body>
</html>
