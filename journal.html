<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal · MindWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="wordmark" href="index.html">MindWell</a>
      <p class="tagline">Mental Health – Emotional Check-In Interface</p>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="chat.html">Companion</a>
      <a href="insights.html">Insights</a>
      <a href="journal.html" aria-current="page">Journal</a>
      <a href="resources.html">Resources</a>
    </nav>
    <div class="account">
      <span id="user-email"></span>
      <button type="button" class="link-button" id="logout-btn" onclick="handleLogout()">Log Out</button>
    </div>
  </header>

  <main>
    <h1>Journal History</h1>
    <div id="loading" class="muted">Loading entries...</div>
    <p id="empty" class="muted" hidden>No journal entries yet. Head to the home page to log your first mood!</p>
    <div id="entries"></div>
  </main>

  <footer class="site-footer">© 2026 MindWell</footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = "login.html"; return; }
      document.getElementById("user-email").textContent = user.email;
      await loadJournal(user.uid);
    });

    window.handleLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };

    // Reflections are user-written; never hand them to innerHTML raw.
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    async function loadJournal(uid) {
      const entriesDiv = document.getElementById("entries");
      const loadingEl = document.getElementById("loading");
      const emptyEl = document.getElementById("empty");

      try {
        const snapshot = await getDocs(collection(db, "users", uid, "moods"));
        loadingEl.hidden = true;

        let entries = [];
        snapshot.forEach(d => entries.push({ date: d.id, ...d.data() }));
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (entries.length === 0) {
          emptyEl.hidden = false;
          return;
        }

        entriesDiv.innerHTML = entries.map(e => {
          const key = escapeHTML(e.mood.toLowerCase());
          return `
            <article class="entry">
              <div class="entry-meta">
                <span>${escapeHTML(e.date)}</span>
                <span class="mood-badge badge-${key}"><span class="swatch swatch-${key}"></span>${escapeHTML(e.mood)}</span>
              </div>
              <div class="reflection">${escapeHTML(e.reflection)}</div>
            </article>
          `;
        }).join("");
      } catch(err) {
        loadingEl.textContent = "Error loading entries.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
