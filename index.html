<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindWell</title>
  <link rel="stylesheet" href="theme.css">
  <script src="intro.js"></script>
  <style>
    #calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin: 20px 0 28px;
    }
    .calendar-day {
      padding: 12px 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-muted);
      transition: background 0.25s ease, transform 0.25s ease,
                  border-color 0.25s ease, color 0.25s ease;
    }
    .calendar-day:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--glass-border-bright);
      color: var(--text);
      transform: translateY(-2px);
    }
    .today {
      border-color: rgba(201,179,242,0.7);
      color: var(--text);
      box-shadow: 0 0 0 1px rgba(201,179,242,0.28), 0 0 16px rgba(201,179,242,0.18);
    }
    .day-calm        { background: var(--mood-calm);        border-color: var(--mood-calm-line);        color: var(--text); }
    .day-okay        { background: var(--mood-okay);        border-color: var(--mood-okay-line);        color: var(--text); }
    .day-anxious     { background: var(--mood-anxious);     border-color: var(--mood-anxious-line);     color: var(--text); }
    .day-overwhelmed { background: var(--mood-overwhelmed); border-color: var(--mood-overwhelmed-line); color: var(--text); }

    .mood-buttons {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .mood-buttons button {
      flex: 1;
      padding: 15px 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      transition: background 0.25s ease, color 0.25s ease,
                  border-color 0.25s ease, transform 0.25s ease,
                  box-shadow 0.25s ease;
    }
    .mood-buttons button:hover {
      background: rgba(255,255,255,0.11);
      border-color: var(--glass-border-bright);
      color: var(--text);
      transform: translateY(-2px);
    }
    .mood-buttons button.selected {
      color: var(--text);
      background: rgba(255,255,255,0.1);
      border-color: var(--mood-line);
      box-shadow: 0 0 22px -2px var(--mood-glow), var(--glass-inset);
      transform: translateY(-2px);
      transition: box-shadow 1.6s ease, border-color 1.6s ease,
                  background 0.25s ease, transform 0.25s ease;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 13px 14px;
      font-size: 14px;
      resize: none;
    }

    .log-button {
      margin-top: 14px;
      padding: 13px;
      width: 100%;
      background: var(--accent-soft);
      border: 1px solid rgba(201,179,242,0.4);
      color: var(--accent);
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }
    .log-button:hover {
      background: rgba(201,179,242,0.26);
      border-color: rgba(201,179,242,0.65);
      box-shadow: 0 0 20px rgba(201,179,242,0.18);
    }
    .log-button.danger {
      margin-top: 8px;
      background: rgba(220,154,154,0.12);
      border-color: rgba(220,154,154,0.35);
      color: var(--danger);
    }
    .log-button.danger:hover {
      background: rgba(220,154,154,0.22);
      border-color: rgba(220,154,154,0.6);
      box-shadow: 0 0 20px rgba(220,154,154,0.15);
    }

    /* Hidden until JS sets display:block — the entrance animation starts at
       that moment, since animations don't run on display:none elements. */
    .output {
      margin-top: 25px;
      padding: 17px 19px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-left: 3px solid var(--mood-line);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 14px;
      display: none;
      animation: fade-up 0.6s cubic-bezier(0.22,0.61,0.36,1) both;
    }
    .output strong { color: var(--text); font-weight: 600; }

    .visual {
      text-align: center;
      font-size: 50px;
      margin-top: 18px;
      transition: opacity 0.5s ease;
    }
    .glow { animation: softGlow 6s ease-in-out infinite alternate; }
    @keyframes softGlow {
      from { filter: brightness(100%) drop-shadow(0 0 10px var(--mood-glow)); }
      to   { filter: brightness(112%) drop-shadow(0 0 26px var(--mood-glow)); }
    }

    #saving-indicator {
      font-size: 13px;
      color: var(--accent);
      margin-top: 10px;
      min-height: 18px;
      text-align: center;
    }

    .prompt { color: var(--text-muted); font-size: 14px; }

    @media (max-width: 620px) {
      .mood-buttons { flex-wrap: wrap; }
      .mood-buttons button {
        flex: 1 1 calc(50% - 5px);
        padding: 13px 6px;
        font-size: 14px;
      }
      #calendar { gap: 5px; }
      .calendar-day { padding: 9px 2px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="cosmos" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>
  <div class="mood-wash" aria-hidden="true"></div>

  <header class="fade-up">
    <nav>
      <a href="index.html">Home</a>
      <a href="chat.html">Companion</a>
      <a href="insights.html">Insights</a>
      <a href="journal.html">Journal</a>
      <a href="resources.html">Resources</a>
      <button id="logout-btn" onclick="handleLogout()">Log Out</button>
    </nav>
    <h1>MindWell</h1>
    <p>Mental Health – Emotional Check-In Interface</p>
    <div id="user-email"></div>
  </header>

  <main class="fade-up d2">
    <h2>Daily Emotional Check-In</h2>
    <h3>Monthly Overview</h3>
    <div id="calendar" class="stagger"></div>

    <p class="prompt">Select your current mood and briefly describe how you feel.</p>
    <div class="mood-buttons stagger">
      <button onclick="selectMood('Calm')">Calm</button>
      <button onclick="selectMood('Okay')">Okay</button>
      <button onclick="selectMood('Anxious')">Anxious</button>
      <button onclick="selectMood('Overwhelmed')">Overwhelmed</button>
    </div>

    <textarea id="reflection" placeholder="Write a short reflection..."></textarea>
    <button class="log-button" onclick="logMood()">Log Mood</button>
    <button class="log-button danger" onclick="clearMood()">Clear Entry</button>
    <div id="saving-indicator"></div>
    <div class="output" id="feedbackBox"></div>
    <div class="visual glow" id="moodVisual"></div>
  </main>

  <footer>© 2026 MindWell</footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let currentUser = null;
    let selectedMood = "";

    // Fixed: use local date methods instead of toISOString() to avoid UTC timezone shift
    const _today = new Date();
    let selectedDate = `${_today.getFullYear()}-${String(_today.getMonth()+1).padStart(2,'0')}-${String(_today.getDate()).padStart(2,'0')}`;

    // Auth gate — redirect to login if not signed in
    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      if (window.MindWellIntro) window.MindWellIntro.play({ hello: "Welcome back", name: "MindWell" });
      document.getElementById("user-email").textContent = user.email;
      await generateCalendar();
      loadEntry(selectedDate);
    });

    window.handleLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };

    async function generateCalendar() {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Fixed: use local date methods instead of toISOString() to avoid UTC timezone shift
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

      // Fetch all mood docs for this user for the month
      const moodsRef = collection(db, "users", currentUser.uid, "moods");
      const snapshot = await getDocs(moodsRef);
      const moodMap = {};
      snapshot.forEach(d => { moodMap[d.id] = d.data(); });

      for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dayDiv = document.createElement("div");
        dayDiv.classList.add("calendar-day");
        dayDiv.innerText = day;
        if (dateStr === todayStr) dayDiv.classList.add("today");
        if (moodMap[dateStr]) dayDiv.classList.add("day-" + moodMap[dateStr].mood.toLowerCase());
        dayDiv.onclick = () => { selectedDate = dateStr; loadEntry(dateStr); };
        calendar.appendChild(dayDiv);
      }
    }

    window.selectMood = function(mood) {
      selectedMood = mood;
      document.body.classList.remove("calm", "okay", "anxious", "overwhelmed");
      document.body.classList.add(mood.toLowerCase());
      const moodVisual = document.getElementById("moodVisual");
      if (mood === "Calm") moodVisual.innerHTML = "🌊✨";
      else if (mood === "Okay") moodVisual.innerHTML = "🌤️🌿";
      else if (mood === "Anxious") moodVisual.innerHTML = "🍃💨";
      else if (mood === "Overwhelmed") moodVisual.innerHTML = "🌧️☁️";

      // Highlight selected button
      document.querySelectorAll(".mood-buttons button").forEach(btn => {
        btn.classList.toggle("selected", btn.textContent === mood);
      });
    };

    window.logMood = async function() {
      const reflectionText = document.getElementById("reflection").value.trim();
      const feedbackBox = document.getElementById("feedbackBox");
      const indicator = document.getElementById("saving-indicator");

      if (!selectedMood) { alert("Please select a mood first."); return; }
      if (!reflectionText) { alert("Please write a short reflection."); return; }

      indicator.textContent = "Saving...";

      try {
        await setDoc(doc(db, "users", currentUser.uid, "moods", selectedDate), {
          mood: selectedMood,
          reflection: reflectionText,
          timestamp: new Date().toISOString()
        });

        indicator.textContent = "✓ Saved";
        setTimeout(() => indicator.textContent = "", 2000);

        const message = (selectedMood === "Calm" || selectedMood === "Okay")
          ? "It looks like you're managing well today. Consider reinforcing what's working for you."
          : "You may be experiencing stress. Consider slowing down, practicing grounding techniques, or reaching out for support.";

        feedbackBox.innerHTML =
          "<strong>Date:</strong> " + selectedDate +
          "<br><strong>Mood:</strong> " + selectedMood +
          "<br><br><strong>Your Reflection:</strong> " + reflectionText +
          "<br><br><strong>System Feedback:</strong> " + message;
        feedbackBox.style.display = "block";

        document.getElementById("reflection").value = "";
        selectedMood = "";
        document.querySelectorAll(".mood-buttons button").forEach(b => b.classList.remove("selected"));
        await generateCalendar();
      } catch (e) {
        indicator.textContent = "Error saving. Please try again.";
        console.error(e);
      }
    };

    async function loadEntry(date) {
      const feedbackBox = document.getElementById("feedbackBox");
      try {
        const snap = await getDoc(doc(db, "users", currentUser.uid, "moods", date));
        if (snap.exists()) {
          const entry = snap.data();
          feedbackBox.innerHTML =
            "<strong>Saved Entry for " + date + ":</strong>" +
            "<br><br><strong>Mood:</strong> " + entry.mood +
            "<br><strong>Reflection:</strong> " + entry.reflection;
          feedbackBox.style.display = "block";
        } else {
          feedbackBox.style.display = "none";
        }
      } catch(e) { console.error(e); }
    }

    window.clearMood = async function() {
      if (!selectedDate) return;
      if (!confirm("Are you sure you want to delete this entry?")) return;
      try {
        await deleteDoc(doc(db, "users", currentUser.uid, "moods", selectedDate));
        document.getElementById("reflection").value = "";
        document.getElementById("feedbackBox").style.display = "none";
        document.getElementById("saving-indicator").textContent = "";
        selectedMood = "";
        await generateCalendar();
      } catch(e) { console.error(e); }
    };
  </script>
</body>
</html>
