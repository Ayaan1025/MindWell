<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="wordmark" href="index.html">MindWell</a>
      <p class="tagline">Mental Health – Emotional Check-In Interface</p>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page">Home</a>
      <a href="chat.html">Companion</a>
      <a href="insights.html">Insights</a>
      <a href="journal.html">Journal</a>
      <a href="resources.html">Resources</a>
    </nav>
    <div class="account">
      <span id="user-email"></span>
      <button type="button" class="link-button" id="logout-btn" onclick="handleLogout()">Log Out</button>
    </div>
  </header>

  <main>
    <h1>Daily Emotional Check-In</h1>

    <div class="calendar-head">
      <h2 id="month-label">Monthly Overview</h2>
    </div>
    <div id="calendar"></div>

    <section class="checkin" aria-labelledby="checkin-heading">
      <h2 id="checkin-heading" class="visually-hidden">Check in</h2>
      <p class="prompt">Select your current mood and briefly describe how you feel.</p>
      <div class="mood-buttons" role="group" aria-label="Mood">
        <button type="button" data-mood="Calm" aria-pressed="false" onclick="selectMood('Calm')"><span class="swatch swatch-calm"></span>Calm</button>
        <button type="button" data-mood="Okay" aria-pressed="false" onclick="selectMood('Okay')"><span class="swatch swatch-okay"></span>Okay</button>
        <button type="button" data-mood="Anxious" aria-pressed="false" onclick="selectMood('Anxious')"><span class="swatch swatch-anxious"></span>Anxious</button>
        <button type="button" data-mood="Overwhelmed" aria-pressed="false" onclick="selectMood('Overwhelmed')"><span class="swatch swatch-overwhelmed"></span>Overwhelmed</button>
      </div>

      <label for="reflection" class="visually-hidden">Reflection</label>
      <textarea id="reflection" placeholder="Write a short reflection..."></textarea>
      <div class="checkin-actions">
        <button type="button" class="btn" onclick="logMood()">Log Mood</button>
        <button type="button" class="link-button danger" onclick="clearMood()">Clear Entry</button>
      </div>
      <div class="status-line" id="saving-indicator" role="status"></div>
    </section>

    <div class="entry-view panel" id="feedbackBox" hidden></div>
  </main>

  <footer class="site-footer">© 2026 MindWell</footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Reflections are user-written; never hand them to innerHTML raw.
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    let currentUser = null;
    let selectedMood = "";

    // Fixed: use local date methods instead of toISOString() to avoid UTC timezone shift
    const _today = new Date();
    let selectedDate = `${_today.getFullYear()}-${String(_today.getMonth()+1).padStart(2,'0')}-${String(_today.getDate()).padStart(2,'0')}`;

    // Auth gate — redirect to login if not signed in
    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      document.getElementById("user-email").textContent = user.email;
      await generateCalendar();
      loadEntry(selectedDate);
    });

    window.handleLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };

    async function generateCalendar() {
      const calendar = document.getElementById("calendar");
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const monthName = now.toLocaleString(undefined, { month: "long" });

      // Fixed: use local date methods instead of toISOString() to avoid UTC timezone shift
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

      // Fetch all mood docs for this user for the month
      const moodsRef = collection(db, "users", currentUser.uid, "moods");
      const snapshot = await getDocs(moodsRef);
      const moodMap = {};
      snapshot.forEach(d => { moodMap[d.id] = d.data(); });

      // Build off-screen and swap in once, so the grid never blinks empty.
      const cells = [];
      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(name => {
        const head = document.createElement("div");
        head.className = "cal-weekday";
        head.textContent = name;
        cells.push(head);
      });

      for (let i = 0; i < firstDay; i++) {
        cells.push(document.createElement("div"));
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const mood = moodMap[dateStr] && moodMap[dateStr].mood;
        const dayBtn = document.createElement("button");
        dayBtn.type = "button";
        dayBtn.className = "calendar-day";
        dayBtn.textContent = day;
        dayBtn.setAttribute("aria-label", `${monthName} ${day}${mood ? ", " + mood : ""}`);
        if (dateStr === todayStr) {
          dayBtn.classList.add("today");
          dayBtn.setAttribute("aria-current", "date");
        }
        if (dateStr === selectedDate) dayBtn.classList.add("is-selected");
        if (mood) dayBtn.classList.add("day-" + mood.toLowerCase());
        dayBtn.onclick = () => {
          selectedDate = dateStr;
          calendar.querySelectorAll(".is-selected").forEach(el => el.classList.remove("is-selected"));
          dayBtn.classList.add("is-selected");
          loadEntry(dateStr);
        };
        cells.push(dayBtn);
      }

      document.getElementById("month-label").textContent = `${monthName} ${year}`;
      calendar.replaceChildren(...cells);
    }

    function resetMoodSelection() {
      selectedMood = "";
      document.body.classList.remove("calm", "okay", "anxious", "overwhelmed");
      document.querySelectorAll(".mood-buttons button").forEach(b => b.setAttribute("aria-pressed", "false"));
    }

    window.selectMood = function(mood) {
      selectedMood = mood;
      // The body class tints the check-in panel; see .checkin in styles.css.
      document.body.classList.remove("calm", "okay", "anxious", "overwhelmed");
      document.body.classList.add(mood.toLowerCase());
      document.querySelectorAll(".mood-buttons button").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.mood === mood));
      });
    };

    window.logMood = async function() {
      const reflectionText = document.getElementById("reflection").value.trim();
      const feedbackBox = document.getElementById("feedbackBox");
      const indicator = document.getElementById("saving-indicator");

      if (!selectedMood) { alert("Please select a mood first."); return; }
      if (!reflectionText) { alert("Please write a short reflection."); return; }

      indicator.textContent = "Saving...";

      try {
        await setDoc(doc(db, "users", currentUser.uid, "moods", selectedDate), {
          mood: selectedMood,
          reflection: reflectionText,
          timestamp: new Date().toISOString()
        });

        indicator.textContent = "✓ Saved";
        setTimeout(() => indicator.textContent = "", 2000);

        const message = (selectedMood === "Calm" || selectedMood === "Okay")
          ? "It looks like you're managing well today. Consider reinforcing what's working for you."
          : "You may be experiencing stress. Consider slowing down, practicing grounding techniques, or reaching out for support.";

        feedbackBox.innerHTML =
          "<strong>Date:</strong> " + selectedDate +
          "<br><strong>Mood:</strong> " + selectedMood +
          "<br><br><strong>Your Reflection:</strong> " + escapeHTML(reflectionText) +
          "<br><br><strong>System Feedback:</strong> " + message;
        feedbackBox.hidden = false;

        document.getElementById("reflection").value = "";
        resetMoodSelection();
        await generateCalendar();
      } catch (e) {
        indicator.textContent = "Error saving. Please try again.";
        console.error(e);
      }
    };

    async function loadEntry(date) {
      const feedbackBox = document.getElementById("feedbackBox");
      try {
        const snap = await getDoc(doc(db, "users", currentUser.uid, "moods", date));
        if (snap.exists()) {
          const entry = snap.data();
          feedbackBox.innerHTML =
            "<strong>Saved Entry for " + date + ":</strong>" +
            "<br><br><strong>Mood:</strong> " + escapeHTML(entry.mood) +
            "<br><strong>Reflection:</strong> " + escapeHTML(entry.reflection);
          feedbackBox.hidden = false;
        } else {
          feedbackBox.hidden = true;
        }
      } catch(e) { console.error(e); }
    }

    window.clearMood = async function() {
      if (!selectedDate) return;
      if (!confirm("Are you sure you want to delete this entry?")) return;
      try {
        await deleteDoc(doc(db, "users", currentUser.uid, "moods", selectedDate));
        document.getElementById("reflection").value = "";
        document.getElementById("feedbackBox").hidden = true;
        document.getElementById("saving-indicator").textContent = "";
        resetMoodSelection();
        await generateCalendar();
      } catch(e) { console.error(e); }
    };
  </script>
</body>
</html>
