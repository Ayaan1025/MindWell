<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insights · MindWell</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="wordmark" href="index.html">MindWell</a>
      <p class="tagline">Daily mood check-ins and a private journal</p>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="chat.html">Companion</a>
      <a href="insights.html" aria-current="page">Insights</a>
      <a href="journal.html">Journal</a>
      <a href="resources.html">Resources</a>
    </nav>
    <div class="account">
      <span id="user-email"></span>
      <button type="button" class="link-button" id="logout-btn" onclick="handleLogout()">Log out</button>
    </div>
  </header>

  <main>
    <h1>Insights</h1>
    <p class="lede">How your check-ins add up over time.</p>
    <div id="loading" aria-busy="true" aria-label="Loading insights">
      <div class="stat"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
      <div class="stat"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
      <div class="stat"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
      <div class="stat"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
    </div>
    <p id="load-error" class="status-line error" hidden></p>
    <div id="stats"></div>
    <p id="streak" hidden></p>
    <p class="summary" id="summary" hidden></p>

    <section class="chart-section" id="chart-section" hidden>
      <h2>Mood over time</h2>
      <div class="chart-box">
        <canvas id="lineChart" aria-label="Mood by date" role="img"></canvas>
      </div>
      <div class="chart-row">
        <div class="chart-box">
          <h3>Share of each mood</h3>
          <canvas id="doughnutChart" aria-label="Share of each mood" role="img"></canvas>
        </div>
        <div class="chart-box">
          <h3>Days per mood</h3>
          <canvas id="barChart" aria-label="Number of days per mood" role="img"></canvas>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">© 2026 MindWell</footer>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = "login.html"; return; }
      document.getElementById("user-email").textContent = user.email;
      await loadInsights(user.uid);
    });

    window.handleLogout = async function() {
      await signOut(auth);
      window.location.href = "login.html";
    };

    const moodScore = { Calm: 4, Okay: 3, Anxious: 2, Overwhelmed: 1 };

    // Mood colors come from styles.css so the charts match the rest of the app.
    const css = getComputedStyle(document.documentElement);
    const token = name => css.getPropertyValue(name).trim();
    const moodColors = {
      Calm: token("--calm"),
      Okay: token("--okay"),
      Anxious: token("--anxious"),
      Overwhelmed: token("--overwhelmed")
    };

    const gridColor = token("--line");

    Chart.defaults.color = token("--text-muted");
    Chart.defaults.borderColor = gridColor;
    Chart.defaults.font.family = '"Source Sans 3", "Segoe UI", system-ui, sans-serif';
    Chart.defaults.font.size = 13;
    Chart.defaults.plugins.tooltip.backgroundColor = token("--text");
    Chart.defaults.plugins.tooltip.titleColor = token("--bg");
    Chart.defaults.plugins.tooltip.bodyColor = token("--bg");
    Chart.defaults.plugins.tooltip.cornerRadius = 4;
    Chart.defaults.plugins.tooltip.padding = 8;

    async function loadInsights(uid) {
      const loadingEl = document.getElementById("loading");
      const statsEl = document.getElementById("stats");
      const summaryEl = document.getElementById("summary");
      const streakEl = document.getElementById("streak");
      const chartSection = document.getElementById("chart-section");

      try {
        const snapshot = await getDocs(collection(db, "users", uid, "moods"));
        loadingEl.hidden = true;

        let counts = { Calm: 0, Okay: 0, Anxious: 0, Overwhelmed: 0 };
        let entries = []; // { date, mood }

        snapshot.forEach(d => {
          const data = d.data();
          if (counts[data.mood] !== undefined) counts[data.mood]++;
          entries.push({ date: d.id, mood: data.mood });
        });

        const total = Object.values(counts).reduce((a, b) => a + b, 0);

        if (total === 0) {
          statsEl.innerHTML = "<p class='muted'>No check-ins yet. Once you've logged a few days, your patterns will show up here. <a href='index.html'>Check in now</a>.</p>";
          return;
        }

        // Mood stats with progress bars
        statsEl.innerHTML = Object.entries(counts).map(([mood, count]) => {
          const pct = total > 0 ? Math.round((count / total) * 100) : 0;
          const key = mood.toLowerCase();
          return `
            <div class="stat">
              <span class="stat-label"><span class="swatch swatch-${key}"></span>${mood}</span>
              <div class="bar-wrap"><div class="bar bar-${key}" style="width:${pct}%"></div></div>
              <span class="stat-count">${count}</span>
            </div>
          `;
        }).join("");

        const dates = entries.map(e => e.date).sort((a, b) => new Date(b) - new Date(a));
        let streak = 0;
        let check = new Date();
        check.setHours(0, 0, 0, 0);
        for (let d of dates) {
          const entryDate = new Date(d + "T00:00:00");
          if (entryDate.toDateString() === check.toDateString()) {
            streak++;
            check.setDate(check.getDate() - 1);
          } else break;
        }
        streakEl.hidden = false;
        streakEl.innerHTML = streak > 0
          ? `You've checked in <strong>${streak}</strong> ${streak === 1 ? "day" : "days"} in a row.`
          : `You haven't checked in today yet. <a href="index.html">Check in</a>.`;
        
        const dominant = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
        const positiveRate = Math.round(((counts.Calm + counts.Okay) / total) * 100);
        summaryEl.hidden = false;
        summaryEl.innerHTML = `
          You've checked in <strong>${total}</strong> ${total === 1 ? "time" : "times"}, and your most
          common mood is <strong>${dominant}</strong>.
          ${positiveRate >= 50
            ? `<strong>${positiveRate}%</strong> of your check-ins were Calm or Okay.`
            : `More than half were Anxious or Overwhelmed. If that's been weighing on you,
               the <a href="resources.html">Resources</a> page has some places to start,
               including people you can talk to.`}
        `;

        chartSection.hidden = false;
        buildCharts(entries, counts);

      } catch (err) {
        loadingEl.hidden = true;
        const errorEl = document.getElementById("load-error");
        errorEl.textContent = "Couldn't load your insights. Refresh the page to try again.";
        errorEl.hidden = false;
        console.error(err);
      }
    }

    function buildCharts(entries, counts) {

      const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
      const lineLabels = sorted.map(e => e.date);
      const lineData = sorted.map(e => moodScore[e.mood]);
      const linePointColors = sorted.map(e => moodColors[e.mood]);

      new Chart(document.getElementById("lineChart"), {
        type: "line",
        data: {
          labels: lineLabels,
          datasets: [{
            label: "Mood",
            data: lineData,
            borderColor: token("--line-strong"),
            borderWidth: 1.5,
            pointBackgroundColor: linePointColors,
            pointBorderColor: linePointColors,
            pointRadius: 4,
            pointHoverRadius: 6,
            tension: 0,
            fill: false,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const scoreToMood = { 4: "Calm", 3: "Okay", 2: "Anxious", 1: "Overwhelmed" };
                  return " " + (scoreToMood[ctx.parsed.y] || "");
                }
              }
            }
          },
          scales: {
            y: {
              min: 0.5,
              max: 4.5,
              ticks: {
                stepSize: 1,
                callback: val => ({ 1: "Overwhelmed", 2: "Anxious", 3: "Okay", 4: "Calm" }[val] || "")
              },
              grid: { color: gridColor },
              border: { color: gridColor }
            },
            x: {
              ticks: { maxTicksLimit: 10, maxRotation: 45 },
              grid: { display: false },
              border: { color: gridColor }
            }
          }
        }
      });

      const doughnutLabels = Object.keys(counts);
      new Chart(document.getElementById("doughnutChart"), {
        type: "doughnut",
        data: {
          labels: doughnutLabels,
          datasets: [{
            data: doughnutLabels.map(m => counts[m]),
            backgroundColor: doughnutLabels.map(m => moodColors[m]),
            borderColor: token("--surface"),
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom",
              labels: { font: { size: 12 }, padding: 12 }
            }
          }
        }
      });

      new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
          labels: Object.keys(counts),
          datasets: [{
            label: "Days",
            data: Object.values(counts),
            backgroundColor: Object.keys(counts).map(m => moodColors[m]),
            borderRadius: 2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1 },
              grid: { color: gridColor },
              border: { color: gridColor }
            },
            x: { grid: { display: false }, border: { color: gridColor } }
          }
        }
      });
    }
  </script>
</body>
</html>
