<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · MindWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="wordmark" href="login.html">MindWell</a>
      <p class="tagline">Daily mood check-ins and a private journal</p>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 id="auth-heading">Welcome back</h1>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login" onclick="switchTab('login')">Log in</button>
        <button type="button" class="tab" role="tab" id="tab-signup" aria-selected="false" aria-controls="form-signup" onclick="switchTab('signup')">Sign up</button>
      </div>

      <div id="form-login" role="tabpanel" aria-labelledby="tab-login">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="you@email.com">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password">
        <button type="button" class="btn" onclick="handleLogin()">Log in</button>
      </div>

      <div id="form-signup" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" autocomplete="email" placeholder="you@email.com">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" autocomplete="new-password" placeholder="At least 6 characters">
        <button type="button" class="btn" onclick="handleSignup()">Create account</button>
      </div>

      <div class="status-line error" id="auth-error" role="alert"></div>
    </div>
  </main>

  <footer class="site-footer">© 2026 MindWell</footer>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // If already logged in, skip to home
    onAuthStateChanged(auth, user => {
      if (user) { window.location.href = "index.html"; return; }
    });

    window.switchTab = function(tab) {
      document.getElementById("tab-login").setAttribute("aria-selected", String(tab === "login"));
      document.getElementById("tab-signup").setAttribute("aria-selected", String(tab === "signup"));
      document.getElementById("form-login").hidden = tab !== "login";
      document.getElementById("form-signup").hidden = tab !== "signup";
      document.getElementById("auth-heading").textContent =
        tab === "login" ? "Welcome back" : "Create your account";
      document.getElementById("auth-error").textContent = "";
    };

    window.handleLogin = async function() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("auth-error");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (e) {
        errorEl.textContent = friendlyError(e.code);
      }
    };

    window.handleSignup = async function() {
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const errorEl = document.getElementById("auth-error");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (e) {
        errorEl.textContent = friendlyError(e.code);
      }
    };

    function friendlyError(code) {
      switch(code) {
        case "auth/invalid-email": return "That email address doesn't look right.";
        case "auth/missing-password": return "Enter your password.";
        case "auth/user-not-found": return "No account uses that email. Want to sign up instead?";
        case "auth/wrong-password":
        case "auth/invalid-credential": return "That email and password don't match.";
        case "auth/email-already-in-use": return "There's already an account with that email. Try logging in.";
        case "auth/weak-password": return "Use at least 6 characters for your password.";
        case "auth/too-many-requests": return "Too many attempts. Wait a few minutes and try again.";
        case "auth/network-request-failed": return "Couldn't reach the server. Check your connection.";
        default: return "Something went wrong. Try again in a moment.";
      }
    }
  </script>
</body>
</html>
