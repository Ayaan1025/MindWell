<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindWell – Login</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header h1 { margin: 0 0 6px 0; }

    /* This page centres a single card instead of using the shared main slab,
       so the glass treatment lives on .card here. */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      max-width: none;
      margin: 0;
      background: none;
      border: none;
      box-shadow: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    .card {
      padding: 38px 40px;
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin: 0 0 26px 0;
      text-align: center;
      font-size: 22px;
    }
    .tabs {
      display: flex;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--glass-border);
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    .tab:hover { color: var(--text-muted); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 13px;
      margin-bottom: 17px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent-soft);
      border: 1px solid rgba(201,179,242,0.4);
      color: var(--accent);
      font-size: 15px;
      font-family: inherit;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.25s ease, border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }
    .btn:hover {
      background: rgba(201,179,242,0.26);
      border-color: rgba(201,179,242,0.65);
      box-shadow: 0 0 20px rgba(201,179,242,0.18);
    }
    .error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="cosmos" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>
  <div class="mood-wash" aria-hidden="true"></div>

  <header class="fade-up">
    <h1>MindWell</h1>
    <p>Mental Health – Emotional Check-In Interface</p>
  </header>
  <main>
    <div class="card glass fade-up d2">
      <h2>Welcome</h2>
      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">Log In</div>
        <div class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <div id="form-login">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
        <button class="btn" onclick="handleLogin()">Log In</button>
      </div>

      <div id="form-signup" style="display:none;">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@email.com">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters">
        <button class="btn" onclick="handleSignup()">Create Account</button>
      </div>

      <div class="error" id="auth-error"></div>
    </div>
  </main>
  <footer>© 2026 MindWell</footer>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // If already logged in, skip to home
    onAuthStateChanged(auth, user => {
      if (user) { window.location.href = "index.html"; return; }
    });

    window.switchTab = function(tab) {
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-signup").classList.toggle("active", tab === "signup");
      document.getElementById("form-login").style.display = tab === "login" ? "block" : "none";
      document.getElementById("form-signup").style.display = tab === "signup" ? "block" : "none";
      document.getElementById("auth-error").textContent = "";
    };

    window.handleLogin = async function() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("auth-error");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (e) {
        errorEl.textContent = friendlyError(e.code);
      }
    };

    window.handleSignup = async function() {
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const errorEl = document.getElementById("auth-error");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (e) {
        errorEl.textContent = friendlyError(e.code);
      }
    };

    function friendlyError(code) {
      switch(code) {
        case "auth/invalid-email": return "Invalid email address.";
        case "auth/user-not-found": return "No account found with that email.";
        case "auth/wrong-password": return "Incorrect password.";
        case "auth/email-already-in-use": return "An account with that email already exists.";
        case "auth/weak-password": return "Password must be at least 6 characters.";
        case "auth/invalid-credential": return "Incorrect email or password.";
        default: return "Something went wrong. Please try again.";
      }
    }
  </script>
</body>
</html>
